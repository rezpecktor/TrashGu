<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrashGu - Masuk</title>
  </head>
  <body class="bg-[#F6F5EF]">
    <main class="min-h-screen lg:grid lg:grid-cols-2">
      <section class="login-editorial-panel relative flex min-h-64 flex-col justify-between overflow-hidden px-5 py-6 text-white sm:min-h-72 sm:px-10 sm:py-8 lg:min-h-screen lg:px-12 lg:py-10 xl:px-16">
        <div class="relative z-10">
          <a href="./index.html" class="inline-flex min-h-11 items-center rounded-md bg-white px-3 py-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white" aria-label="Kembali ke beranda TrashGu">
            <img src="./assets/images/logo.png" alt="TrashGu" class="h-9 w-auto sm:h-10" />
          </a>
        </div>

        <div class="relative z-10 mt-12 max-w-xl lg:mt-auto lg:pb-6">
          <p class="mb-3 text-sm font-semibold tracking-wide text-[#DDE8DB]">Kenali, pilah, dan kelola</p>
          <p id="editorial-heading" class="max-w-lg text-3xl font-bold leading-tight sm:text-4xl lg:text-5xl">
            Kenali sampah.<br />Mulai dari sini.
          </p>
          <p class="mt-4 max-w-md text-base leading-relaxed text-white/90 sm:text-lg">
            Langkah sederhana menuju kebiasaan pemilahan yang lebih baik.
          </p>
        </div>
      </section>

      <section class="flex items-center bg-[#F6F5EF] px-5 py-10 sm:px-10 sm:py-14 lg:px-12 xl:px-20">
        <div class="mx-auto w-full max-w-md">
          <div class="mb-8">
            <p class="mb-2 text-sm font-semibold text-[#244C3D]">Selamat datang kembali</p>
            <h1 class="text-3xl font-bold tracking-tight text-[#202A25] sm:text-4xl">Masuk ke TrashGu</h1>
            <p class="mt-3 max-w-sm leading-relaxed text-[#526159]">
              Lanjutkan klasifikasi dan lihat kembali riwayat pemilahan Anda.
            </p>
          </div>

          <form id="loginForm" class="space-y-5" novalidate>
            <div>
              <label for="login-identifier" class="mb-2 block text-sm font-semibold text-[#202A25]">Nama pengguna atau email</label>
              <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                  <svg class="h-5 w-5 text-[#526159]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                  </svg>
                </div>
                <input id="login-identifier" name="identifier" type="text" autocomplete="username" required aria-describedby="identifier-error" aria-invalid="false" class="block min-h-12 w-full rounded-lg border border-[#AAB7AC] bg-white px-4 py-3 pl-12 text-base text-[#202A25] shadow-sm placeholder:text-[#6B776F] focus:border-[#244C3D] focus:outline-none focus:ring-2 focus:ring-[#244C3D]" placeholder="Masukkan nama pengguna atau email" />
              </div>
              <p id="identifier-error" class="mt-2 hidden text-sm font-medium text-[#A12626]" aria-live="assertive"></p>
            </div>

            <div>
              <label for="login-password" class="mb-2 block text-sm font-semibold text-[#202A25]">Kata sandi</label>
              <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                  <svg class="h-5 w-5 text-[#526159]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" />
                  </svg>
                </div>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-login-error" aria-invalid="false" class="block min-h-12 w-full rounded-lg border border-[#AAB7AC] bg-white px-4 py-3 pl-12 pr-14 text-base text-[#202A25] shadow-sm placeholder:text-[#6B776F] focus:border-[#244C3D] focus:outline-none focus:ring-2 focus:ring-[#244C3D]" placeholder="Masukkan kata sandi Anda" />
                <button type="button" id="toggle-password-login" class="absolute inset-y-0 right-1 my-auto inline-flex h-11 w-11 items-center justify-center rounded-md text-[#526159] hover:bg-[#DDE8DB] hover:text-[#244C3D] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#244C3D]" aria-label="Tampilkan kata sandi" aria-controls="login-password" aria-pressed="false">
                  <svg class="h-5 w-5" id="eye-icon-login-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                  </svg>
                  <svg class="hidden h-5 w-5" id="eye-icon-login-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                    <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.742L2.293 6.546A10.005 10.005 0 01.458 10c1.274 4.057 5.064 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
                  </svg>
                </button>
              </div>
              <p id="password-login-error" class="mt-2 hidden text-sm font-medium text-[#A12626]" aria-live="assertive"></p>
            </div>

            <button id="loginSubmitButton" type="submit" class="inline-flex min-h-12 w-full items-center justify-center rounded-lg border border-transparent bg-[#244C3D] px-5 py-3 text-base font-semibold text-white shadow-sm transition-colors hover:bg-[#18392D] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#244C3D] active:bg-[#102B21] disabled:cursor-not-allowed disabled:opacity-60">
              <svg id="loginSpinner" class="mr-3 hidden h-5 w-5 animate-spin text-white motion-reduce:animate-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span id="loginButtonText">Masuk</span>
            </button>
          </form>

          <div id="login-message" class="mt-4 min-h-6 text-sm font-medium" role="status" aria-live="polite"></div>

          <p class="mt-8 border-t border-[#D7DED5] pt-6 text-sm text-[#526159]">
            Belum punya akun?
            <a href="./registrasi.html" class="inline-flex min-h-11 items-center font-semibold text-[#244C3D] underline decoration-1 underline-offset-4 hover:text-[#18392D] focus-visible:rounded-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#244C3D]">Buat akun</a>
          </p>
        </div>
      </section>
    </main>

    <script>
      const loginForm = document.getElementById('loginForm');
      const loginMessage = document.getElementById('login-message');
      const identifierInput = document.getElementById('login-identifier');
      const passwordInputLogin = document.getElementById('login-password');
      const identifierError = document.getElementById('identifier-error');
      const passwordLoginError = document.getElementById('password-login-error');
      const loginSubmitButton = document.getElementById('loginSubmitButton');
      const loginButtonText = document.getElementById('loginButtonText');
      const loginSpinner = document.getElementById('loginSpinner');
      const passwordToggleLogin = document.getElementById('toggle-password-login');

      let passwordLoginToggleTimeout;

      function setPasswordVisibilityLogin(isVisible, input, openIcon, closedIcon) {
        input.type = isVisible ? 'text' : 'password';
        openIcon.classList.toggle('hidden', isVisible);
        closedIcon.classList.toggle('hidden', !isVisible);
        passwordToggleLogin.setAttribute('aria-pressed', String(isVisible));
        passwordToggleLogin.setAttribute('aria-label', isVisible ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
      }

      function togglePasswordVisibilityLogin(inputId, openIconId, closedIconId, timeoutDuration = 2000) {
        const input = document.getElementById(inputId);
        const openIcon = document.getElementById(openIconId);
        const closedIcon = document.getElementById(closedIconId);
        const isVisible = input.type === 'password';

        clearTimeout(passwordLoginToggleTimeout);
        setPasswordVisibilityLogin(isVisible, input, openIcon, closedIcon);

        if (isVisible) {
          passwordLoginToggleTimeout = setTimeout(() => {
            setPasswordVisibilityLogin(false, input, openIcon, closedIcon);
          }, timeoutDuration);
        }
      }

      passwordToggleLogin.addEventListener('click', () => {
        togglePasswordVisibilityLogin('login-password', 'eye-icon-login-open', 'eye-icon-login-closed');
      });

      document.addEventListener('DOMContentLoaded', () => {
        if (identifierInput) identifierInput.focus();
      });

      loginForm.addEventListener('submit', async function(event) {
        event.preventDefault();
        loginMessage.textContent = '';
        loginMessage.className = 'mt-4 min-h-6 text-sm font-medium';
        identifierError.textContent = '';
        identifierError.classList.add('hidden');
        passwordLoginError.textContent = '';
        passwordLoginError.classList.add('hidden');
        identifierInput.setAttribute('aria-invalid', 'false');
        passwordInputLogin.setAttribute('aria-invalid', 'false');

        const identifier = identifierInput.value;
        const password = passwordInputLogin.value;
        let isValid = true;

        if (!identifier.trim()) {
          identifierError.textContent = 'Nama pengguna atau email tidak boleh kosong.';
          identifierError.classList.remove('hidden');
          identifierInput.setAttribute('aria-invalid', 'true');
          isValid = false;
        }
        if (!password.trim()) {
          passwordLoginError.textContent = 'Kata sandi tidak boleh kosong.';
          passwordLoginError.classList.remove('hidden');
          passwordInputLogin.setAttribute('aria-invalid', 'true');
          isValid = false;
        }

        if (!isValid) {
          loginForm.querySelector('[aria-invalid="true"]')?.focus();
          return;
        }

        loginSubmitButton.disabled = true;
        loginButtonText.textContent = 'Masuk...';
        loginSpinner.classList.remove('hidden');

        try {
          const response = await fetch('http://127.0.0.1:5000/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              identifier: identifier,
              password: password,
            }),
          });

          const result = await response.json();

          if (response.ok) {
            loginMessage.textContent = result.message || 'Login berhasil! Mengarahkan ke dashboard...';
            loginMessage.classList.add('text-[#24613F]');
            localStorage.setItem('authToken', result.token);
            localStorage.setItem('currentUser', JSON.stringify(result.user));
            loginForm.reset();
            setTimeout(() => {
              window.location.href = './dashboard.html';
            }, 1500);
          } else {
            loginMessage.textContent = result.error || 'Login gagal. Periksa kembali kredensial Anda.';
            loginMessage.classList.add('text-[#A12626]');
          }
        } catch (error) {
          console.error('Error:', error);
          loginMessage.textContent = 'Terjadi kesalahan koneksi. Silakan coba lagi nanti.';
          loginMessage.classList.add('text-[#A12626]');
        } finally {
          loginSubmitButton.disabled = false;
          loginButtonText.textContent = 'Masuk';
          loginSpinner.classList.add('hidden');
        }
      });
    </script>
  </body>
</html>
